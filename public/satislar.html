<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satışlar — Abiye Stok</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--surface:#fff;--surface2:#f1efe9;--border:#e0ddd6;--border-strong:#c8c4bc;
  --text:#1a1a18;--text-sec:#6b6860;--text-muted:#9e9b94;
  --accent:#4f6ef7;--accent-bg:#eef1fe;--accent-text:#2d49c4;
  --success-bg:#eaf3de;--success-text:#3b6d11;
  --warning-bg:#faeeda;--warning-text:#854f0b;
  --input-border:#8b5cf6;--input-border-focus:#ffffff;
  --radius:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#181816;--surface:#242422;--surface2:#2e2e2b;--border:#3a3a36;--border-strong:#4e4e4a;
  --text:#f0ede6;--text-sec:#a09d96;--text-muted:#6b6860;
  --accent:#6b87ff;--accent-bg:#1a2040;--accent-text:#a0b0ff;
  --success-bg:#172510;--success-text:#7acc44;
  --warning-bg:#2a1e08;--warning-text:#f0b060;
}}
:root[data-theme="light"]{
  --bg:#f8f7f5;--surface:#fff;--surface2:#f1efe9;--border:#e0ddd6;--border-strong:#c8c4bc;
  --text:#1a1a18;--text-sec:#6b6860;--text-muted:#9e9b94;
  --accent:#4f6ef7;--accent-bg:#eef1fe;--accent-text:#2d49c4;
  --success-bg:#eaf3de;--success-text:#3b6d11;
  --warning-bg:#faeeda;--warning-text:#854f0b;
}
:root[data-theme="dark"]{
  --bg:#181816;--surface:#242422;--surface2:#2e2e2b;--border:#3a3a36;--border-strong:#4e4e4a;
  --text:#f0ede6;--text-sec:#a09d96;--text-muted:#6b6860;
  --accent:#6b87ff;--accent-bg:#1a2040;--accent-text:#a0b0ff;
  --success-bg:#172510;--success-text:#7acc44;
  --warning-bg:#2a1e08;--warning-text:#f0b060;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;min-height:54px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;position:sticky;top:0;z-index:20}
header h1{font-size:15px;font-weight:600;flex:1 1 auto;min-width:140px}
.btn{height:30px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:11px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--surface2)}

.main{max-width:1200px;margin:0 auto;padding:16px 20px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
.scard-label{font-size:11px;color:var(--text-muted);margin-bottom:3px}
.scard-value{font-size:19px;font-weight:600}

.toolbar{margin-bottom:12px}
.search-wrap{position:relative;width:100%;max-width:320px}
.toolbar input{height:34px;padding:0 30px 0 10px;border:1px solid var(--input-border);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:13px;width:100%}
.toolbar input:focus{outline:none;border-color:var(--input-border-focus)}
.search-clear{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;border-radius:50%;background:transparent;color:var(--text-muted);cursor:pointer;align-items:center;justify-content:center;padding:0}
.search-clear:hover{background:var(--surface2);color:var(--text)}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface2)}
th{padding:8px 10px;text-align:left;font-weight:600;font-size:11px;color:var(--text-sec);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}

@media(max-width:600px){
  input,select,textarea{font-size:16px!important}
}
</style>
<script>
(function(){
  var saved = localStorage.getItem('theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  window.toggleTheme = function(){
    var current = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateThemeIcon();
  };
  window.updateThemeIcon = function(){
    var icon = document.getElementById('theme-icon');
    if (!icon) return;
    var current = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    icon.innerHTML = current === 'dark'
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  };
  document.addEventListener('DOMContentLoaded', updateThemeIcon);
})();
</script>
</head>
<body>

<header>
  <a href="/" class="btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Stok Listesi
  </a>
  <h1>Satışlar</h1>
  <a href="barkodlar.html" class="btn">Barkodlar</a>
  <a href="beden.html" class="btn">Beden Tablosu</a>
  <a href="tedarikci.html" class="btn">Tedarikçiler</a>
  <button class="btn" id="theme-toggle" style="width:30px;padding:0;justify-content:center" onclick="toggleTheme()" title="Görünüm modu (açık/koyu)">
    <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
  </button>
  <span id="user-email" style="font-size:11px;color:var(--text-muted);white-space:nowrap"></span>
  <button class="btn" onclick="logout()" title="Çıkış yap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Çıkış
  </button>
</header>

<div class="main">
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="satis-search" placeholder="SKU veya ürün adına göre ara...">
      <button type="button" class="search-clear" id="satis-search-clear" title="Aramayı temizle" onclick="document.getElementById('satis-search').value='';document.getElementById('satis-search').dispatchEvent(new Event('input',{bubbles:true}));document.getElementById('satis-search').focus();">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div id="main-content">
    <div class="empty-state">Yükleniyor...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const app = initializeApp({
  apiKey:"AIzaSyBED4SOH13mpdpuGLHwG_wl6lhe1a4YNos",
  authDomain:"stok-19117.firebaseapp.com",
  projectId:"stok-19117",
  storageBucket:"stok-19117.firebasestorage.app",
  messagingSenderId:"599549832875",
  appId:"1:599549832875:web:4570ade50e2731469091ee"
});
const db = getFirestore(app);
const auth = getAuth(app);
window.logout = () => signOut(auth);

let satislar = [];
let arama = '';

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmtN = n => Number(n||0).toLocaleString('tr-TR');
const fmt = n => Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmtTarih(t){
  if(!t) return '—';
  const d = t.toDate ? t.toDate() : (t instanceof Date ? t : new Date(t));
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// Giriş yapılmadan Firestore'a hiç istek atılmaz — onSnapshot çağrısı kasıtlı olarak
// auth durumu netleşene kadar başlamıyor (bkz. giris.html + Firestore kuralları).
onAuthStateChanged(auth, user => {
  if(!user){ location.href = 'giris.html?redirect=satislar.html'; return; }
  document.getElementById('user-email').textContent = user.email || '';

  onSnapshot(collection(db,'satislar'), snap => {
    satislar = snap.docs.map(d=>({id:d.id,...d.data()}));
    satislar.sort((a,b)=>{
      const ta = a.tarih && a.tarih.toDate ? a.tarih.toDate().getTime() : 0;
      const tb = b.tarih && b.tarih.toDate ? b.tarih.toDate().getTime() : 0;
      return tb - ta;
    });
    render();
  }, () => {
    document.getElementById('main-content').innerHTML = '<div class="empty-state">Bağlantı kurulamadı.</div>';
  });
});

document.getElementById('satis-search').addEventListener('input', e=>{ arama = e.target.value.toLowerCase(); render(); });

function render(){
  if(!satislar.length){
    document.getElementById('main-content').innerHTML = '<div class="empty-state">Henüz satış kaydı yok — İKAS Ayarları\'ndan "Webhook Kur" ile satışlar otomatik akmaya başlar.</div>';
    return;
  }

  const list = satislar.filter(s=>{
    if(!arama) return true;
    return String(s.sku||'').toLowerCase().includes(arama) || String(s.urunAdi||'').toLowerCase().includes(arama);
  });

  const toplamAdet = list.reduce((s,r)=>s+Number(r.adet||0),0);
  const toplamCiro = list.reduce((s,r)=>s+Number(r.adet||0)*Number(r.fiyat||0),0);

  const rows = list.map(s=>`<tr>
    <td><span style="font-family:monospace;font-size:12px;font-weight:600">${esc(s.sku||'—')}</span></td>
    <td>${esc(s.urunAdi||'—')}</td>
    <td class="r">${fmtN(s.adet)}</td>
    <td class="r">₺${fmt(s.fiyat)}</td>
    <td style="font-size:12px;color:var(--text-sec)">${fmtTarih(s.tarih)}</td>
  </tr>`).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="summary">
      <div class="scard"><div class="scard-label">Satış Satırı</div><div class="scard-value">${fmtN(list.length)}</div></div>
      <div class="scard"><div class="scard-label">Toplam Adet</div><div class="scard-value">${fmtN(toplamAdet)}</div></div>
      <div class="scard"><div class="scard-label">Toplam Ciro</div><div class="scard-value">₺${fmtN(Math.round(toplamCiro))}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>SKU</th><th>Ürün Adı</th><th class="r">Adet</th><th class="r">Satış Fiyatı</th><th>Tarih</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="empty-state">Sonuç yok</td></tr>`}</tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
